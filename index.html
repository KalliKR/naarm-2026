<style>
/* Layout: sticky dark top bar with a yellow Contact button, one centred column of content,
   route-marker pennants and an 11-step progress strip as the recurring motif. */
:root {
  --bg: #EEF1F4;
  --surface: #FFFFFF;
  --ink: #14202B;
  --muted: #55626F;
  --line: #CBD3DB;
  --red: #D1352B;
  --on-red: #FFFFFF;
  --yellow: #F5B800;
  --on-yellow: #14202B;
  --green: #8EC127;
  --on-green: #14202B;
  --bar: #0E5547;
  --on-bar: #F2F5F8;
  --err: #B3261E;
  --ok: #1E7A3C;
  --focus: #1B6FD6;
  --map-land: #E3E8ED;
  --map-water: #B9D3E6;
  --map-park: #CFE3CF;
  --map-road: #FFFFFF;
  --f-display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 1.0625rem/1.6 var(--f-body);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--bar); z-index: 10;
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }

.wrap {
  width: 100%; max-width: 900px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: var(--bar); color: var(--on-bar);
  border-bottom: 3px solid var(--yellow);
}
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font: 900 1.6rem/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.brand .mark { width: 26px; height: 20px; background: var(--yellow); clip-path: polygon(0 0, 100% 0, 80% 50%, 100% 100%, 0 100%); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  min-height: 44px; padding: .6rem 1.1rem; border-radius: 6px; border: 2px solid transparent;
  font: 600 1rem/1.2 var(--f-body); text-decoration: none; cursor: pointer; text-align: center;
}
.btn-primary { background: var(--bar); color: var(--surface); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-yellow { background: var(--yellow); color: var(--on-yellow); }
.btn-yellow:hover { filter: brightness(1.06); }
/* .btn-yellow[aria-current="page"] { box-shadow: 0 0 0 3px var(--bar), 0 0 0 5px var(--yellow); } */
.btn-line { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn-line:hover { background: var(--ink); color: var(--bg); }
.btn-lg { min-height: 52px; padding: .75rem 1.5rem; font-size: 1.125rem; }

/* Type */
main { flex: 1 0 auto; padding-block: 32px 56px; }
h1, h2 { text-wrap: balance; margin: 0; }
h1 { font: 900 clamp(2.5rem, 8vw, 4.25rem)/.95 var(--f-display); text-transform: uppercase; letter-spacing: .01em; }
h2 { font: 800 1.75rem/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
p { margin: 0; }
.eyebrow { font: 600 .8rem/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
.lead { font-size: 1.2rem; }
.stack { display: flex; flex-direction: column; gap: 24px; }

/* Landing */
.hero { display: flex; flex-direction: column; gap: 18px; padding-block: 12px 8px; }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.faq { display: flex; flex-direction: column; gap: 12px; margin-top: 40px; }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
summary {
  list-style: none; cursor: pointer; padding: 16px 18px; font: 600 1.1rem/1.3 var(--f-body);
  display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 56px;
}
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font: 800 1.6rem/1 var(--f-display); color: var(--red); flex: none; transition: transform .15s; }
details[open] summary::after { transform: rotate(45deg); }
details .ans { padding: 0 18px 18px; }
details .ans a { color: var(--red); font-weight: 600; }

/* Progress strip */
.strip { display: grid; grid-template-columns: repeat(var(--n, 11), minmax(0, 1fr)); gap: 4px; list-style: none; margin: 0; padding: 0; }
.strip .s {
  display: grid; place-items: center; min-height: 38px; border-radius: 4px; text-decoration: none;
  font: 800 1rem/1 var(--f-display); letter-spacing: .02em; font-variant-numeric: tabular-nums;
}
.s.done { background: var(--green); color: var(--on-green); }
.s.todo { background: var(--yellow); color: var(--on-yellow); }
.s.lock { background: var(--line); color: var(--muted); }
a.s:hover { filter: brightness(1.08); }
.strip-wrap { display: flex; flex-direction: column; gap: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .85rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.legend .l-done::before { background: var(--green); }
.legend .l-todo::before { background: var(--yellow); }
/* .legend .l-sel::before { background: var(--surface); box-shadow: inset 0 0 0 2px var(--ink); } */
.legend .l-lock::before { background: var(--line); }

/* Clue page */
.clue-head { display: flex; align-items: center; gap: 18px; }
.pennant {
  flex: none; width: 84px; height: 72px; background: var(--red); color: var(--on-red);
  border-left: 9px solid var(--ink); clip-path: polygon(0 0, 100% 0, 88% 50%, 100% 100%, 0 100%);
  display: grid; place-items: center; padding-right: 8px;
  font: 900 2.6rem/1 var(--f-display); font-variant-numeric: tabular-nums;
}
.pennant.locked { background: var(--line); color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.clue-text, .activity-text { font-size: 1.25rem; line-height: 1.55; white-space: pre-line; }
.activity-text { font-size: 1.125rem; }
.clue-copy { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.clue-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 280px); gap: 24px; align-items: start; }
.clue-img { margin: 0; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: #E1E6EB; }
.clue-img svg, .clue-img img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; }
@media (max-width: 640px) { .clue-body { grid-template-columns: minmax(0, 1fr); } .clue-img { max-width: 360px; } }
.clue-body.solo { grid-template-columns: minmax(0, 1fr); }
.video { position: relative; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: #000; max-width: 100%; }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video-link { font-weight: 600; }
.sub { color: var(--muted); }
label { font: 600 .9rem/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .1em; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
input[type="text"] {
  flex: 1 1 220px; min-width: 0; min-height: 52px; padding: .5rem .9rem; border-radius: 6px;
  border: 2px solid var(--line); background: var(--bg); color: var(--ink);
  font: 500 1.15rem/1.2 var(--f-mono); letter-spacing: .04em;
}
input[type="text"]:focus-visible { border-color: var(--focus); outline-offset: 0; }
.msg { min-height: 1.5em; font-weight: 600; }
.msg.err { color: var(--err); }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.ok-card h2 { color: var(--bar); }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* Contact */
.num { font: 500 clamp(1.6rem, 6vw, 2.4rem)/1.1 var(--f-mono); letter-spacing: .02em; user-select: all; word-break: break-word; }
.addr { font-weight: 600; user-select: all; }
.map-link { display: block; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.map-link svg { display: block; width: 100%; height: auto; }
.copy-status { min-height: 1.5em; color: var(--muted); font-size: .95rem; }

footer { border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 20px; padding-block: 18px; }
.link-btn { background: none; border: 0; padding: 8px 0; min-height: 44px; color: inherit; font: inherit; text-decoration: underline; cursor: pointer; }

@media (max-width: 480px) {
  .pennant { width: 68px; height: 60px; font-size: 2.1rem; }
  .card { padding: 18px; }
  .strip .s { min-height: 34px; font-size: .9rem; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .shake { animation: none; }
  summary::after { transition: none; }
}
</style>

/* ---------- State ---------- */
const TOTAL = CLUES.length;
const CLUE_COUNT = CLUES.filter(c => c.password).length; /* steps with a password; the final step has none */
let unlocked = 1; /* highest clue the team can open; TOTAL + 1 means finished */
try {
  const saved = parseInt(localStorage.getItem('race-day-progress'), 10);
  if (saved >= 1 && saved <= TOTAL + 1) unlocked = saved;
} catch (e) {}
function saveProgress() { try { localStorage.setItem('race-day-progress', String(unlocked)); } catch (e) {} }

const view = document.getElementById('view');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s).toLowerCase().replace(/\s+/g, '');

/* ---------- Pieces ---------- */
function strip(current) {
  let items = '';
  for (let n = 1; n <= TOTAL; n++) {
    const state = n < unlocked ? 'done' : (n === unlocked ? 'todo' : 'lock');
    const cls = state + (n === current ? ' sel' : '');
    const label = 'Clue ' + n + (state === 'done' ? ', completed' : (state === 'todo' ? ', not done yet' : ', locked')) + (n === current ? ', viewing' : '');
    items += n <= unlocked && n <= TOTAL
      ? '<li><a class="s ' + cls + '" href="#clue-' + n + '" aria-label="' + label + '"' + (n === current ? ' aria-current="page"' : '') + '>' + n + '</a></li>'
      : '<li><span class="s lock" aria-label="' + label + '">' + n + '</span></li>';
  }
  return '<div class="strip-wrap"><ol class="strip" style="--n:' + TOTAL + '" aria-label="Race progress">' + items + '</ol>' +
    '<div class="legend"><span class="l-done">Completed</span><span class="l-todo">Incomplete</span><span class="l-lock">Locked</span></div></div>';
}

  const cur = Math.min(unlocked, TOTAL);
  let label = 'Start the race: Clue 1';
  if (unlocked > TOTAL) label = 'Review your clues';
  else if (unlocked > 1) label = 'Continue to Clue ' + unlocked;
  const faq = FAQS.map(f => '<details><summary>' + esc(f.q) + '</summary><div class="ans"><p>' + esc(f.a) +
    (f.q.indexOf('contact') > -1 ? ' <a href="#contact">Go to Contact</a>' : '') + '</p></div></details>').join('');
  return '<div class="stack">' +
    '<section class="hero">' +
      // '<p class="eyebrow">' + TOTAL + ' clues · 1 password each</p>' +
      '<h1 id="pageTitle" tabindex="-1">Welcome to Melbourne</h1>' +
      '<p class="lead">Navigate to the each of the secret locations and complete the activity listed. When a teacher confirms that you have successfully done the task, they will give you the password to unlock your next clue. Remember, this is a race!</p>' +
      '<div class="cta-row"><a class="btn btn-primary btn-lg" href="#clue-' + cur + '">' + label + '</a></div>' +
    '</section>' +
    strip(0) +
    '<section class="faq" aria-labelledby="faqHead"><h2 id="faqHead">Frequently asked questions</h2>' + faq + '</section>' +
  '</div>';
}

/* Add an `image` to a clue (a data: URI or a file published with the page) to replace the placeholder. */
function clueImage(c, n) {
  if (c.image) return '<figure class="clue-img"><img src="' + esc(c.image) + '" alt="' + esc(c.imageAlt || 'Picture for clue ' + n) + '"></figure>';
  if (c.video && !c.image) return '';
  return '<figure class="clue-img"><svg viewBox="0 0 400 300" role="img" aria-label="Placeholder for the picture for clue ' + n + '" xmlns="http://www.w3.org/2000/svg">' +
    '<rect width="400" height="300" fill="#E1E6EB"/>' +
    '<circle cx="290" cy="104" r="26" fill="#C3CCD5"/>' +
    '<path d="M40 232 L136 128 L204 196 L252 150 L360 232 Z" fill="#C3CCD5"/>' +
    '<rect x="40" y="232" width="320" height="6" fill="#C3CCD5"/>' +
    '<text x="200" y="272" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="2" fill="#55626F">PHOTO PLACEHOLDER</text>' +
    '</svg></figure>';
}

/* Secondary text between the clue and the password box. Leave `activity` empty to hide it. */
function activitySection(c) {
  if (!c.activity) return '';
  return '<section class="card activity" aria-labelledby="activityHead"><h2 id="activityHead">Activity</h2><p class="activity-text">' + esc(c.activity) + '</p></section>';
}

function eyebrowText(n) { return CLUES[n - 1].password ? 'Clue ' + n + ' of ' + CLUE_COUNT : 'Final step'; }

function ytId(v) {
  v = String(v);
  const m = /(?:v=|youtu\.be\/|embed\/)([\w-]{11})/.exec(v);
  return m ? m[1] : (/^[\w-]{11}$/.test(v) ? v : '');
}

/* Embedded YouTube video between the clue and the activity. Needs a site that allows iframes. */
function videoSection(c) {
  const id = c.video ? ytId(c.video) : '';
  if (!id) return '';
  return '<section class="card" aria-label="Video">' +
    '<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/I2RXgHfqYx0?si=gil6wiokBuJLJivw&amp;controls=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>' +
    '<p><a class="video-link" href="https://www.youtube.com/watch?v=' + id + '" target="_blank" rel="noopener">Watch on YouTube</a></p></section>';
}

function lockedView(n) {
  const cur = Math.min(unlocked, TOTAL);
  return '<div class="stack">' +
    '<div class="clue-head"><div class="pennant locked" aria-hidden="true">' + n + '</div>' +
    '<div><p class="eyebrow">' + eyebrowText(n) + '</p><h1 id="pageTitle" tabindex="-1">Locked</h1></div></div>' +
    strip(0) +
    '<div class="card"><p class="clue-text">Clue ' + n + ' opens after your team enters the password for Clue ' + (n - 1) + '.</p>' +
    '<div><a class="btn btn-primary" href="#clue-' + cur + '">Go to Clue ' + cur + '</a></div></div>' +
  '</div>';
}

function clueView(n) {
  if (n > unlocked) return lockedView(n);
  const c = CLUES[n - 1];
  const hasPw = !!c.password;
  /* A step with no password counts as complete as soon as it is opened. */
  if (!hasPw && n === unlocked) { unlocked = n + 1; saveProgress(); }
  const done = n < unlocked;
  const last = n === TOTAL;
  const nextWord = n < TOTAL ? (CLUES[n].password ? 'Clue ' + (n + 1) : 'the final step') : '';
  const nextShort = n < TOTAL ? (CLUES[n].password ? 'Clue ' + (n + 1) : 'Final step') : '';
  let panel = '';
  if (!hasPw) {
    panel = '';
  } else if (done) {
    panel = '<div class="card ok-card" id="result" tabindex="-1"><h2>Correct!</h2>' +
      '<p>' + (last ? 'Activity verified. Your team has finished all ' + CLUE_COUNT + ' clues. Head to the finish location and check the Contact page for the map.' : 'Activity verified. ' + nextWord.charAt(0).toUpperCase() + nextWord.slice(1) + ' is unlocked.') + '</p>' +
      '<div class="row">' +
      (last ? '<a class="btn btn-primary" href="#contact">Finish line location</a>' : '<a class="btn btn-primary" href="#clue-' + (n + 1) + '">Go to ' + nextWord + '</a>') +
      '</div></div>';
  } else {
    panel = '<form class="card" id="checkin" novalidate autocomplete="off">' +
      '<h2>Check password</h2>' +
      '<p class="sub">Finished the activity? Enter the password from the teacher at your location to ' + (last ? 'finish the race.' : 'unlock ' + nextWord + '.') + '</p>' +
      // '<label for="pw">Activity password</label>' +
      '<div class="row"><input id="pw" name="pw" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" aria-describedby="msg">' +
      '<button class="btn btn-primary" type="submit">Submit</button></div>' +
      '<p class="msg" id="msg" role="status" aria-live="polite"></p>' +
      '</form>';
  }
  const prev = n > 1 ? '<a class="btn btn-line" href="#clue-' + (n - 1) + '">&larr; Clue ' + (n - 1) + '</a>' : '<span></span>';
  const next = (n < TOTAL && n < unlocked) ? '<a class="btn btn-line" href="#clue-' + (n + 1) + '">' + nextShort + ' &rarr;</a>' : '<span></span>';
  const img = clueImage(c, n);
  return '<div class="stack">' +
    '<div class="clue-head"><div class="pennant" aria-hidden="true">' + n + '</div>' +
    '<div><p class="eyebrow">' + eyebrowText(n) + '</p><h1 id="pageTitle" tabindex="-1">' + esc(c.title) + '</h1></div></div>' +
    strip(n) +
    '<article class="card clue-body' + (img ? '' : ' solo') + '"><div class="clue-copy">' + (hasPw ? '<h2>Clue</h2>' : '') + '<p class="clue-text">' + esc(c.text) + '</p></div>' + img + '</article>' +
    videoSection(c) +
    activitySection(c) +
    panel +
    '<nav class="pager" aria-label="Clue navigation">' + prev + next + '</nav>' +
  '</div>';
}

function contactView() {
  const tel = CONFIG.phone.replace(/[^\d+]/g, '');
  return '<div class="stack">' +
    // '<section class="stack" style="gap:10px"><p class="eyebrow">' + esc(CONFIG.contactName) + '</p>' +
    '<h1 id="pageTitle" tabindex="-1">Contact</h1>' +
    '<p class="lead">Call the number below if there is an emergency, or your team is lost or has a problem with a clue.</p></section>' +
    '<section class="card" aria-labelledby="phoneHead"><h2 id="phoneHead">'+ esc(CONFIG.contactName) +'</h2>' +
      '<p class="num" id="phoneNum">' + esc(CONFIG.phone) + '</p>' +
      '<div class="row"><button class="btn btn-primary" type="button" id="copyBtn">Copy number</button>' +
      '<a class="btn btn-line" href="tel:' + esc(tel) + '">Call</a></div>' +
      '<p class="copy-status" id="copyStatus" role="status" aria-live="polite"></p></section>' +
    '<section class="card" aria-labelledby="mapHead"><h2 id="mapHead">Location</h2>' +
      '<p class="addr">' + esc(CONFIG.address) + '</p>' +
      '<a class="map-link" href="' + esc(CONFIG.mapsUrl) + '" target="_blank" rel="noopener" aria-label="Open the location in Google Maps (opens in a new tab)">' + mapSvg() + '</a>' +
      '<div><a class="btn btn-primary" href="' + esc(CONFIG.mapsUrl) + '" target="_blank" rel="noopener">Open in Google Maps</a></div></section>' +
  '</div>';
}

function mapSvg() {
  return '<svg viewBox="0 0 640 340" role="img" aria-label="Illustrated map with a pin at the race location" xmlns="http://www.w3.org/2000/svg">' +
    '<rect width="640" height="340" fill="var(--map-land)"/>' +
    '<path d="M-10 250 C 120 210, 200 300, 330 262 S 560 190, 650 232 L 650 290 C 560 250, 450 330, 330 312 S 110 262, -10 300 Z" fill="var(--map-water)"/>' +
    '<rect x="40" y="36" width="150" height="96" rx="6" fill="var(--map-park)"/>' +
    '<rect x="450" y="150" width="130" height="62" rx="6" fill="var(--map-park)"/>' +
    '<g stroke="var(--map-road)" stroke-linecap="round" fill="none">' +
      '<path d="M0 150 H640" stroke-width="14"/><path d="M0 60 H640" stroke-width="8"/><path d="M0 214 H400" stroke-width="8"/>' +
      '<path d="M250 0 V340" stroke-width="14"/><path d="M410 0 V260" stroke-width="8"/><path d="M110 0 V210" stroke-width="8"/><path d="M540 0 V340" stroke-width="8"/>' +
    '</g>' +
    '<g transform="translate(250 150)">' +
      '<ellipse cx="0" cy="2" rx="14" ry="5" fill="var(--ink)" opacity=".25"/>' +
      '<path d="M0 0 C -22 -26 -22 -52 0 -56 C 22 -52 22 -26 0 0 Z" fill="var(--red)"/>' +
      '<circle cx="0" cy="-36" r="8" fill="var(--on-red)"/>' +
    '</g>' +
    '<g transform="translate(274 96)"><rect width="104" height="30" rx="4" fill="var(--surface)" stroke="var(--line)"/>' +
      '<text x="52" y="20" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="15" font-weight="600" fill="var(--ink)">Race location</text></g>' +
  '</svg>';
}

/* ---------- Router ---------- */
function parseRoute() {
  const h = location.hash.replace(/^#/, '');
  if (h === 'contact') return { page: 'contact' };
  const m = /^clue-(\d+)$/.exec(h);
  if (m) {
    const n = parseInt(m[1], 10);
    if (n >= 1 && n <= TOTAL) return { page: 'clue', n: n };
  }
  return { page: 'home' };
}

function render(opts) {
  opts = opts || {};
  const r = parseRoute();
  view.innerHTML = r.page === 'contact' ? contactView() : (r.page === 'clue' ? clueView(r.n) : homeView());
  const cb = document.getElementById('contactBtn');
  if (r.page === 'contact') cb.setAttribute('aria-current', 'page'); else cb.removeAttribute('aria-current');
  bind(r);
  if (opts.focus) {
    const el = document.querySelector(opts.focus);
    if (el) el.focus({ preventScroll: false });
  } else if (opts.navigated) {
    window.scrollTo(0, 0);
    const t = document.getElementById('pageTitle');
    if (t) t.focus({ preventScroll: true });
  }
}

function bind(r) {
  if (r.page === 'clue') {
    const form = document.getElementById('checkin');
    if (form) form.addEventListener('submit', function (e) {
      e.preventDefault();
      const input = document.getElementById('pw');
      const msg = document.getElementById('msg');
      const value = norm(input.value);
      if (!value) { msg.className = 'msg err'; msg.textContent = 'Enter a password.'; input.focus(); return; }
      if (value === norm(CLUES[r.n - 1].password)) {
        unlocked = Math.max(unlocked, r.n + 1);
        saveProgress();
        render({ focus: '#result' });
      } else {
        msg.className = 'msg err';
        msg.textContent = 'That password is not right. Make sure to complete the activity and ask the teacher at your location.';
        form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
        input.select();
      }
    });
  }
  if (r.page === 'contact') {
    const btn = document.getElementById('copyBtn');
    const status = document.getElementById('copyStatus');
    btn.addEventListener('click', async function () {
      const el = document.getElementById('phoneNum');
      try {
        await navigator.clipboard.writeText(CONFIG.phone);
        status.textContent = 'Number copied.';
      } catch (err) {
        const range = document.createRange(); range.selectNodeContents(el);
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
        status.textContent = 'Number selected. Copy it with your device’s copy command.';
      }
    });
  }
}

/* Reset with an in-page confirmation step */
const resetBtn = document.getElementById('resetBtn');
let resetTimer = null;
resetBtn.addEventListener('click', function () {
  if (resetBtn.dataset.armed === '1') {
    clearTimeout(resetTimer);
    unlocked = 1; saveProgress();
    resetBtn.dataset.armed = ''; resetBtn.textContent = 'Reset my progress';
    if (location.hash !== '#home' && location.hash !== '') location.hash = 'home'; else render({ navigated: true });
  } else {
    resetBtn.dataset.armed = '1';
    resetBtn.textContent = 'Tap again to erase progress';
    resetTimer = setTimeout(function () { resetBtn.dataset.armed = ''; resetBtn.textContent = 'Reset my progress'; }, 4000);
  }
});

window.addEventListener('hashchange', function () { render({ navigated: true }); });
render();
</script>

</body></html>
